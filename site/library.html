<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FlaskViewer · File Library</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/library.css"></head>
<body><div class="bg-mesh"></div><div class="bg-grid"></div>
<header class="topbar library-topbar"><div class="brand"><a class="back-link" href="/">←</a><div class="logo">◈</div><div><h1>File Library</h1><div class="sub"><span class="live-dot"></span><span>ComfyUI storage</span></div></div></div><div class="controls"><a class="btn" href="/">Image Gallery</a><label class="btn primary upload-button">＋ Upload images<input id="upload-files" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/gif" multiple hidden></label></div></header>
<main class="library-main"><section class="volume-section"><div class="section-heading"><div><h2>Storage overview</h2><p>Capacity of detected system volumes</p></div><button class="btn" id="refresh-storage">Refresh</button></div><div class="volume-grid" id="volume-grid"><div class="library-loading">Loading storage…</div></div></section>
<section class="browser-section"><aside class="locations-panel"><h2>Locations</h2><div id="locations" class="locations-list">Loading…</div><div class="location-note">Browsing is limited to ComfyUI-managed folders and FlaskViewer history.</div></aside>
<div class="files-panel"><div class="files-toolbar"><div><h2 id="current-title">ComfyUI Output</h2><div class="breadcrumbs" id="breadcrumbs"></div></div><input id="file-search" type="search" placeholder="Search this folder…"></div><div class="files-summary" id="files-summary"></div><div class="file-list" id="file-list"><div class="library-loading">Choose a location to browse files.</div></div><div class="pagination"><button class="btn" id="prev-page" disabled>Previous</button><span id="page-label">Page 1</span><button class="btn" id="next-page" disabled>Next</button></div></div></section></main>
<div class="preview-modal" id="preview-modal" hidden><div class="preview-card"><div class="preview-head"><div><strong id="preview-name"></strong><span id="preview-meta"></span></div><button class="icon-btn" id="preview-close">✕</button></div><img id="preview-image" alt="File preview"><div class="preview-actions"><a class="btn primary" id="preview-download">Download</a></div></div></div><div class="toast" id="toast"></div><script src="/static/library.js"></script></body></html>
